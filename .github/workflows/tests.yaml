name: Standalone Nakama MySQL release tests
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: ['release/nakama-*-mysql-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database-tests:
    name: Full suite (${{ matrix.label }})
    runs-on: ubuntu-latest
    # 15m ordinary packages + 30m isolated stress + cold build/report headroom.
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: mysql-8.4
            backend: mysql
            mysql_image: mysql:8.4@sha256:0744ee5ef89ce6ccfa13de3e579fe6b9e27f93dd70da9c06d2c908b1b193fb8d
          - label: mysql-26.7
            backend: mysql
            mysql_image: mysql:26.7.0@sha256:ade067ae2fb15eeb6143e81185afe22573e3b3addc58aaf90c41999fa6883991
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Verify progress and failure reporting
        run: python3 -B dev/parity_tools_test.py
      - name: Test fresh database with race detector and vet
        env:
          PARITY_MYSQL_IMAGE: ${{ matrix.mysql_image }}
        run: bash dev/parity.sh "${{ matrix.backend }}"
      - name: Preserve test inventory, skips and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-${{ matrix.label }}
          path: .parity-results/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  candidate-image:
    name: Build tested MySQL candidate
    needs: database-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build candidate without publishing or deploying
        run: |
          docker build --build-arg VERSION=3.41.0-mysql --build-arg COMMIT="$GITHUB_SHA" -f build/Dockerfile -t "nakama-mysql:$GITHUB_SHA" .
          mkdir candidate
          docker image inspect "nakama-mysql:$GITHUB_SHA" --format '{{.Id}}' > candidate/image-id.txt
          printf '%s\n' "$GITHUB_SHA" > candidate/source-commit.txt
          docker save "nakama-mysql:$GITHUB_SHA" | gzip > candidate/image.tar.gz
      - name: Preserve tested candidate
        uses: actions/upload-artifact@v4
        with:
          name: nakama-mysql-candidate
          path: candidate/
          retention-days: 7
